<html>

<style>

  font-family: "FiraSans";
  src: url("FiraSans-Italic.woff2") format("woff2");

  font-style: normal;
}

@font-face {
  font-family: "BlackItalic";

}

}

   font-family: BlackItalic;
}
</style>
</head>
<body>

	<p id="primeiro-container">
	Qualquer texto do primeiro parágrafo.
	</p>

	<p id="segundo-container">
	Qualquer texto do segundo parágrafo. 
	</p>
</body>
</html>
